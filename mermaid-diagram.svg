flowchart TB
    Start([Début]) --> Choix{Nouveau doctorant<br>ou déjà inscrit ?}

    %% ==================== INSCRIPTION ====================
    Choix -->|Nouveau| Inscription

    subgraph Inscription [" "]
        direction TB

        subgraph Candidat_Ins ["Candidat"]
            A1[Préinscription sur GCD]
            A3[Choix du sujet de thèse]
            A6[Inscription administrative]
        end

        subgraph Directeur_These ["Directeur de thèse"]
            A2[Proposition et saisie des sujets]
            A4[Organisation et conduite des entretiens]
        end

        subgraph Structure_CED ["Structure de recherche + CED"]
            A2b[Validation des sujets]
            A5[Sélection des candidats<br>+ Affichage des résultats]
        end

        subgraph Admin ["Administration de l'établissement"]
            A7[Réception des PV et finalisation]
        end

        A1 --> A2 --> A2b --> A3 --> A4 --> A5 --> A6 --> A7
    end

    %% ==================== RÉINSCRIPTION ====================
    Choix -->|Déjà inscrit| Reinscription

    subgraph Reinscription [" "]
        direction TB

        subgraph Doctorant ["Doctorant"]
            B1[Préparation et dépôt du rapport d'activités]
            B3[Dépôt des documents signés sur GCD]
            B5[Dépôt du dossier papier]
        end

        subgraph Dir_These_R ["Directeur de thèse"]
            B2[Avis motivé du comité de thèse]
        end

        subgraph CED_R ["Centre d'Études Doctorales CED"]
            B4[Validation de la réinscription]
        end

        subgraph Admin_R ["Administration de l'établissement"]
            B6[Réception du dossier de réinscription]
        end

        B1 --> B2 --> B3 --> B4 --> B5 --> B6
    end

    Inscription --> Fin([Fin])
    Reinscription --> Fin
